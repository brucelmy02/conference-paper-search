 devoid of noise, leading the dynamics to a Nash equilibrium. A recent re-emerging trend underscores the promise of the perturbation approach, where payoff functions are perturbed based on the distance from an anchoring, or slingshot, strategy. In response, we propose Adaptively Perturbed MD (APMD), which adjusts the magnitude of the perturbation by repeatedly updating the slingshot strategy at a predefined interval. This innovation empowers us to find a Nash equilibrium of the underlying game with guaranteed rates. Empirical demonstrations affirm that our algorithm exhibits significantly accelerated convergence.", "url": "https://proceedings.mlr.press/v235/abe24a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/abe24a/abe24a.pdf", "acceptance": "accepted", "sources": [{"id": "abstract", "kind": "abstract", "text": "This paper proposes a payoff perturbation technique for the Mirror Descent (MD) algorithm in games where the gradient of the payoff functions is monotone in the strategy profile space, potentially containing additive noise. The optimistic family of learning algorithms, exemplified by optimistic MD, successfully achieves last-iterate convergence in scenarios devoid of noise, leading the dynamics to a Nash equilibrium. A recent re-emerging trend underscores the promise of the perturbation approach, where payoff functions are perturbed based on the distance from an anchoring, or slingshot, strategy. In response, we propose Adaptively Perturbed MD (APMD), which adjusts the magnitude of the perturbation by repeatedly updating the slingshot strategy at a predefined interval. This innovation empowers us to find a Nash equilibrium of the underlying game with guaranteed rates. Empirical demonstrations affirm that our algorithm exhibits significantly accelerated convergence.", "url": "https://proceedings.mlr.press/v235/abe24a.html", "locator": "Abstract"}, {"id": "title", "kind": "title", "text": "Adaptively Perturbed Mirror Descent for Learning in Games", "url": "https://proceedings.mlr.press/v235/abe24a.html", "locator": "title"}], "display_id": "P-765A7AEB226F", "assessment": {"paper_id": "pmlr:235:abe24a", "decision": "exclude", "relevance": "low", "relation": null, "topic_ids": [], "reason": "研究博弈中的镜像下降与Nash均衡收敛；摘要支持优化算法目标，未给出Transformer/LLM推理成本问题或具体可迁移推理机制。", "reading_focus": "", "differences": [], "evidence": [{"source_id": "abstract", "quote": "find a Nash equilibrium of the underlying game with guaranteed rates"}], "uncertainties": [], "evidence_status": "sufficient", "priority": 3}, "topic_labels": [], "reading_status": "unread", "user_notes": ""}, {"id": "pmlr:235:abhyankar24a", "title": "InferCept: Efficient Intercept Support for Augmented Large Language Model Inference", "authors": ["Reyna Abhyankar", "Zijian He", "Vikranth Srivatsa", "Hao Zhang", "Yiying Zhang"], "abstract": "Large language models are increasingly integrated with external environments, tools, and agents like ChatGPT plugins to extend their capability beyond language-centric tasks. However, today’s LLM inference systems are designed for standalone LLMs. They treat each external interaction as the end of LLM generation and form a new request when the interaction finishes, causing unnecessary recomputation of already computed contexts, which accounts for 37-40% of total model forwarding time. This paper presents InferCept, the first LLM inference framework targeting augmented LLMs and supporting the efficient interception of LLM generation. InferCept minimizes the GPU resource waste caused by LLM interceptions and dedicates saved memory for serving more requests.InferCept improves the overall serving throughput by 1.6x-2x and completes 2x more requests per second compared to the state-of-the-art LLM inference systems.", "url": "https://proceedings.mlr.press/v235/abhyankar24a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/abhyankar24a/abhyankar24a.pdf", "acceptance": "accepted", "sources": [{"id": "abstract", "kind": "abstract", "text": "Large language models are increasingly integrated with external environments, tools, and agents like ChatGPT plugins to extend their capability beyond language-centric tasks. However, today’s LLM inference systems are designed for standalone LLMs. They treat each external interaction as the end of LLM generation and form a new request when the interaction finishes, causing unnecessary recomputation of already computed contexts, which accounts for 37-40% of total model forwarding time. This paper presents InferCept, the first LLM inference framework targeting augmented LLMs and supporting the efficient interception of LLM generation. InferCept minimizes the GPU resource waste caused by LLM interceptions and dedicates saved memory for serving more requests.InferCept improves the overall serving throughput by 1.6x-2x and completes 2x more requests per second compared to the state-of-the-art LLM inference systems.", "url": "https://proceedings.mlr.press/v235/abhyankar24a.html", "locator": "Abstract"}, {"id": "title", "kind": "title", "text": "InferCept: Efficient Intercept Support for Augmented Large Language Model Inference", "url": "https://proceedings.mlr.press/v235/abhyankar24a.html", "locator": "title"}], "display_id": "P-24C19D3E6FE8", "assessment": {"paper_id": "pmlr:235:abhyankar24a", "decision": "include", "relevance": "high", "relation": "direct", "topic_ids": ["systems"], "reason": "工具或外部环境交互把LLM生成切成多个请求时，会重新计算已有上下文。InferCept针对截断和恢复过程减少GPU资源浪费，并把节约的内存用于服务更多请求，直接对应推理系统成本。", "reading_focus": "优先查阅生成拦截与恢复协议、上下文复用和GPU内存管理；随后核对外部调用时延、并发负载及吞吐实验设置。", "differences": ["面向工具或代理增强的LLM，价值来自交互中断后的资源利用；与权重量化、注意力头合并对应不同开销。"], "evidence": [{"source_id": "abstract", "quote": "InferCept minimizes the GPU resource waste caused by LLM interceptions and dedicates saved memory for serving more requests."}], "uncertainties": ["仅阅读摘要；资源管理机制与吞吐结论尚未核对正文。", "普通连续生成任务的收益尚不明确。", "现场展示、时间、地点和作者到场均未核实。"], "evidence_status": "sufficient", "priority": 2}, "topic_labels": ["以推理系统降低 Transformer/大语言模型推理的计算与内存成本"], "reading_status": "unread", "user_notes": ""}, {"id": "pmlr:235:acharya24a", "title": "Balancing Feature Similarity and Label Variability for Optimal Size-Aware One-shot Subset Selection", "authors": ["Abhinab Acharya", "Dayou Yu", "Qi Yu", "Xumin Liu"], "abstract": "Subset or core-set selection offers a data-efficient way for training deep learning models. One-shot subset selection poses additional challenges as subset selection is only performed once and full set data become unavailable after the selection. However, most existing methods tend to choose either diverse or difficult data samples, which fail to faithfully represent the joint data distribution that is comprised of both feature and label information. The selection is also performed independently from the subset size, which plays an essential role in choosing what types of samples. To address this critical gap, we propose to conduct Feature similarity and Label variability Balanced One-shot Subset Selection (BOSS), aiming to construct an optimal size-aware subset for data-efficient deep learning. We show that a novel balanced core-set loss bound theoretically justifies the need to simultaneously consider both diversity and difficulty to form an optimal subset. It also reveals how the subset size influences the bound. We further connect the inaccessible bound to a practical surrogate target which is tailored to subset sizes and varying levels of overall difficulty. We design a novel Beta-scoring importance function to delicately control the optimal balance of diversity and difficulty. Comprehensive experiments conducted on both synthetic and real data justify the important theoretical properties and demonstrate the superior performance of BOSS as compared with the competitive baselines.", "url": "https://proceedings.mlr.press/v235/acharya24a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/acharya24a/acharya24a.pdf", "acceptance": "accepted", "sources": [{"id": "abstract", "kind": "abstract", "text": "Subset or core-set selection offers a data-efficient way for training deep learning models. One-shot subset selection poses additional challenges as subset selection is only performed once and full set data become unavailable after the selection. However, most existing methods tend to choose either diverse or difficult data samples, which fail to faithfully represent the joint data distribution that is comprised of both feature and label information. The selection is also performed independently from the subset size, which plays an essential role in choosing what types of samples. To address this critical gap, we propose to conduct Feature similarity and Label variability Balanced One-shot Subset Selection (BOSS), aiming to construct an optimal size-aware subset for data-efficient deep learning. We show that a novel balanced core-set loss bound theoretically justifies the need to simultaneously consider both diversity and difficulty to form an optimal subset. It also reveals how the subset size influences the bound. We further connect the inaccessible bound to a practical surrogate target which is tailored to subset sizes and varying levels of overall difficulty. We design a novel Beta-scoring importance function to delicately control the optimal balance of diversity and difficulty. Comprehensive experiments conducted on both synthetic and real data justify the important theoretical properties and demonstrate the superior performance of BOSS as compared with the competitive baselines.", "url": "https://proceedings.mlr.press/v235/acharya24a.html", "locator": "Abstract"}, {"id": "title", "kind": "title", "text": "Balancing Feature Similarity and Label Variability for Optimal Size-Aware One-shot Subset Selection", "url": "https://proceedings.mlr.press/v235/acharya24a.html", "locator": "title"}], "display_id": "P-5CF8D1482DB2", "assessment": {"paper_id": "pmlr:235:acharya24a", "decision": "exclude", "relevance": "low", "relation": null, "topic_ids": [], "reason": "BOSS选择训练数据子集，目标是数据高效训练；摘要不讨论Transformer/LLM推理成本，落在用户暂不关注的训练优化边界。", "reading_focus": "", "differences": [], "evidence": [{"source_id": "abstract", "quote": "Subset or core-set selection offers a data-efficient way for training deep learning models."}], "uncertainties": [], "evidence_status": "sufficient", "priority": 3}, "topic_labels": [], "reading_status": "unread", "user_notes": ""}, {"id": "pmlr:235:achituve24a", "title": "Bayesian Uncertainty for Gradient Aggregation in Multi-Task Learning", "authors": ["Idan Achituve", "Idit Diamant", "Arnon Netzer", "Gal Chechik", "Ethan Fetaya"], "abstract": "As machine learning becomes more prominent there is a growing demand to perform several inference tasks in parallel. Multi-task learning (MTL) addresses this challenge by learning a single model that solves several tasks simultaneously and efficiently. Often optimizing MTL models entails first computing the gradient of the loss for each task, and then aggregating all the gradients to obtain a combined update direction. However, common methods following this approach do not consider an important aspect, the sensitivity in the dimensions of the gradients. Some dimensions may be more lenient for changes while others may be more restrictive. Here, we introduce a novel gradient aggregation procedure using Bayesian inference. We place a probability distribution over the task-specific parameters, which in turn induce a distribution over the gradients of the tasks. This valuable information allows us to quantify the uncertainty associated with each of the gradients’ dimensions which is factored in when aggregating them. We empirically demonstrate the benefits of our approach in a variety of datasets, achieving state-of-the-art performance.", "url": "https://proceedings.mlr.press/v235/achituve24a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/achituve24a/achituve24a.pdf", "acceptance": "accepted", "sources": [{"id": "abstract", "kind": "abstract", "text": "As machine learning becomes more prominent there is a growing demand to perform several inference tasks in parallel. Multi-task learning (MTL) addresses this challenge by learning a single model that solves several tasks simultaneously and efficiently. Often optimizing MTL models entails first computing the gradient of the loss for each task, and then aggregating all the gradients to obtain a combined update direction. However, common methods following this approach do not consider an important aspect, the sensitivity in the dimensions of the gradients. Some dimensions may be more lenient for changes while others may be more restrictive. Here, we introduce a novel gradient aggregation procedure using Bayesian inference. We place a probability distribution over the task-specific parameters, which in turn induce a distribution over the gradients of the tasks. This valuable information allows us to quantify the uncertainty associated with each of the gradients’ dimensions which is factored in when aggregating them. We empirically demonstrate the benefits of our approach in a variety of datasets, achieving state-of-the-art performance.", "url": "https://proceedings.mlr.press/v235/achituve24a.html", "locator": "Abstract"}, {"id": "title", "kind": "title", "text": "Bayesian Uncertainty for Gradient Aggregation in Multi-Task Learning", "url": "https://proceedings.mlr.press/v235/achituve24a.html", "locator": "title"}], "display_id": "P-5F8169392E05", "assessment": {"paper_id": "pmlr:235:achituve24a", "decision": "exclude", "relevance": "low", "relation": null, "topic_ids": [], "reason": "主要贡献是多任务训练中的梯度聚合。摘要中的Bayesian inference表示概率推断，用来度量梯度不确定性；不能据此当作LLM部署推理优化。", "reading_focus": "", "differences": [], "evidence": [{"source_id": "abstract", "quote": "introduce a novel gradient aggregation procedure using Bayesian inference."}], "uncertainties": [], "evidence_status": "sufficient", "priority": 3}, "topic_labels": [], "reading_status": "unread", "user_notes": ""}, {"id": "pmlr:235:achtibat24a", "title": "AttnLRP: Attention-Aware Layer-Wise Relevance Propagation for Transformers", "authors": ["Reduan Achtibat", "Sayed Mohammad Vakilzadeh Hatefi", "Maximilian Dreyer", "Aakriti Jain", "Thomas Wiegand", "Sebastian Lapuschkin", "Wojciech Samek"], "abstract": "Large Language Models are prone to biased predictions and hallucinations, underlining the paramount importance of understanding their model-internal reasoning process. However, achieving faithful attributions for the entirety of a black-box transformer model and maintaining computational efficiency is an unsolved challenge. By extending the Layer-wise Relevance Propagation attribution method to handle attention layers, we address these challenges effectively. While partial solutions exist, our method is the first to faithfully and holistically attribute not only input but also latent representations of transformer models with the computational efficiency similar to a single backward pass. Through extensive evaluations against existing methods on LLaMa 2, Mixtral 8x7b, Flan-T5 and vision transformer architectures, we demonstrate that our proposed approach surpasses alternative methods in terms of faithfulness and enables the understanding of latent representations, opening up the door for concept-based explanations. We provide an LRP library at https://github.com/rachtibat/LRP-eXplains-Transformers.", "url": "https://proceedings.mlr.press/v235/achtibat24a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/achtibat24a/achtibat24a.pdf", "acceptance": "accepted", "sources": [{"id": "abstract", "kind": "abstract", "text": "Large Language Models are prone to biased predictions and hallucinations, underlining the paramount importance of understanding their model-internal reasoning process. However, achieving faithful attributions for the entirety of a black-box transformer model and maintaining computational efficiency is an unsolved challenge. By extending the Layer-wise Relevance Propagation attribution method to handle attention layers, we address these challenges effectively. While partial solutions exist, our method is the first to faithfully and holistically attribute not only input but also latent representations of transformer models with the computational efficiency similar to a single backward pass. Through extensive evaluations against existing methods on LLaMa 2, Mixtral 8x7b, Flan-T5 and vision transformer architectures, we demonstrate that our proposed approach surpasses alternative methods in terms of faithfulness and enables the understanding of latent representations, opening up the door for concept-based explanations. We provide an LRP library at https://github.com/rachtibat/LRP-eXplains-Transformers.", "url": "https://proceedings.mlr.press/v235/achtibat24a.html", "locator": "Abstract"}, {"id": "title", "kind": "title", "text": "AttnLRP: Attention-Aware Layer-Wise Relevance Propagation for Transformers", "url": "https://proceedings.mlr.press/v235/achtibat24a.html", "locator": "title"}], "display_id": "P-60F2B6644E97", "assessment": {"paper_id": "pmlr:235:achtibat24a", "decision": "exclude", "relevance": "low", "relation": null, "topic_ids": [], "reason": "AttnLRP让Transformer归因解释更高效且覆盖attention层；优化的是模型解释计算，其摘要未将目标设为降低生成推理的计算或内存成本。", "reading_focus": "", "differences": ["attention和computational efficiency两类词都出现，但研究问题是归因解释。"], "evidence": [{"source_id": "abstract", "quote": "By extending the Layer-wise Relevance Propagation attribution method to handle attention layers"}], "uncertainties": [], "evidence_status": "sufficient", "priority": 3}, "topic_labels": [], "reading_status": "unread", "user_notes": ""}, {"id": "pmlr:235:adcock24a", "title": "A Unified Framework for Learning with Nonlinear Model Classes from Arbitrary Linear Samples", "authors": ["Ben Adcock", "Juan M. Cardenas", "Nick Dexter"], "abstract": "This work considers the fundamental problem of learning an unknown object from training data using a given model class. We introduce a framework that allows for objects in arbitrary Hilbert spaces, general types of (random) linear measurements as training data and general types of nonlinear model classes. We establish a series of learning guarantees for this framework, which provide explicit relations between the amount of training data and the model class to ensure near-best generalization bounds. In doing so, we introduce the key notion of the variation of a model class with respect to a distribution of sampling operators. We show that this framework can accommodate many different types of well-known problems of interest, such as matrix sketching by random sampling, compressed sensing with isotropic vectors, active learning in regression and compressed sensing with generative models. In all cases, known results become straightforward corollaries of our general theory. Hence, this work provides a powerful framework for studying and analyzing many different types of learning problems.", "url": "https://proceedings.mlr.press/v235/adcock24a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/adcock24a/adcock24a.pdf", "acceptance": "accepted", "sources": [{"id": "abstract", "kind": "abstract", "text": "This work considers the fundamental problem of learning an unknown object from training data using a given model class. We introduce a framework that allows for objects in arbitrary Hilbert spaces, general types of (random) linear measurements as training data and general types of nonlinear model classes. We establish a series of learning guarantees for this framework, which provide explicit relations between the amount of training data and the model class to ensure near-best generalization bounds. In doing so, we introduce the key notion of the variation of a model class with respect to a distribution of sampling operators. We show that this framework can accommodate many different types of well-known problems of interest, such as matrix sketching by random sampling, compressed sensing with isotropic vectors, active learning in regression and compressed sensing with generative models. In all cases, known results become straightforward corollaries of our general theory. Hence, this work provides a powerful framework for studying and analyzing many different types of learning problems.", "url": "https://proceedings.mlr.press/v235/adcock24a.html", "locator": "Abstract"}, {"id": "title", "kind": "title", "text": "A Unified Framework for Learning with Nonlinear Model Classes from Arbitrary Linear Samples", "url": "https://proceedings.mlr.press/v235/adcock24a.html", "locator": "title"}], "display_id": "P-A1030DEE4EB7", "assessment": {"paper_id": "pmlr:235:adcock24a", "decision": "exclude", "relevance": "low", "relation": null, "topic_ids": [], "reason": "研究从线性样本学习未知对象的一般保证与泛化界；压缩感知和sketching在此服务学习问题，摘要没有具体Transformer/LLM推理迁移机制。", "reading_focus": "", "differences": [], "evidence": [{"source_id": "abstract", "quote": "We establish a series of learning guarantees for this framework"}], "uncertainties": [], "evidence_status": "sufficient", "priority": 3}, "topic_labels": [], "reading_status": "unread", "user_notes": ""}, {"id": "pmlr:235:adepu24a", "title": "FrameQuant: Flexible Low-Bit Quantization for Transformers", "authors": ["Harshavardhan Adepu", "Zhanpeng Zeng", "Li Zhang", "Vikas Singh"], "abstract": "Transformers are the backbone of powerful foundation models for many Vision and Natural Language Processing tasks. But their compute and memory/storage footprint is large, and so, serving such models is expensive often requiring high-end hardware. To mitigate this difficulty, Post-Training Quantization seeks to modify a pre-trained model and quantize it to eight bits or lower, significantly boosting compute/memory/latency efficiency. Such models have been successfully quantized to four bits with some performance loss. In this work, we outline a simple scheme to quantize Transformer-based models to just two bits (plus some overhead) with only a small drop in accuracy. Key to our formulation is a concept borrowed from Harmonic analysis called Fusion Frames. Our main finding is that the quantization must take place not in the original weight space, but instead in the Fusion Frame representations. If quantization is interpreted as the addition of noise, our casting of the problem allows invoking an extensive body of known consistent recovery and noise robustness guarantees. Further, if desired, de-noising filters are known in closed form. We show empirically, via a variety of experiments, that (almost) two-bit quantization for Transformer models promises sizable efficiency gains. The code is available at https://github.com/vsingh-group/FrameQuant", "url": "https://proceedings.mlr.press/v235/adepu24a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/adepu24a/adepu24a.pdf", "acceptance": "accepted", "sources": [{"id": "abstract", "kind": "abstract", "text": "Transformers are the backbone of powerful foundation models for many Vision and Natural Language Processing tasks. But their compute and memory/storage footprint is large, and so, serving such models is expensive often requiring high-end hardware. To mitigate this difficulty, Post-Training Quantization seeks to modify a pre-trained model and quantize it to eight bits or lower, significantly boosting compute/memory/latency efficiency. Such models have been successfully quantized to four bits with some performance loss. In this work, we outline a simple scheme to quantize Transformer-based models to just two bits (plus some overhead) with only a small drop in accuracy. Key to our formulation is a concept borrowed from Harmonic analysis called Fusion Frames. Our main finding is that the quantization must take place not in the original weight space, but instead in the Fusion Frame representations. If quantization is interpreted as the addition of noise, our casting of the problem allows invoking an extensive body of known consistent recovery and noise robustness guarantees. Further, if desired, de-noising filters are known in closed form. We show empirically, via a variety of experiments, that (almost) two-bit quantization for Transformer models promises sizable efficiency gains. The code is available at https://github.com/vsingh-group/FrameQuant", "url": "https://proceedings.mlr.press/v235/adepu24a.html", "locator": "Abstract"}, {"id": "title", "kind": "title", "text": "FrameQuant: Flexible Low-Bit Quantization for Transformers", "url": "https://proceedings.mlr.press/v235/adepu24a.html", "locator": "title"}], "display_id": "P-A4B6E56A62B6", "assessment": {"paper_id": "pmlr:235:adepu24a", "decision": "include", "relevance": "high", "relation": "direct", "topic_ids": ["quant"], "reason": "FrameQuant明确以Transformer服务的计算和内存成本为问题，采用训练后量化，并在Fusion Frame表示中进行近两比特量化。与用户的量化和部署效率兴趣直接匹配。", "reading_focus": "优先阅读Fusion Frame表示与量化过程，检查额外表示开销、精度损失和部署时算子实现；重点区分模型压缩、显存节约与真实推理加速。", "differences": ["通过低比特参数表示减少开销，与CHAI在运行时减少attention头的冗余不同。", "摘要明确保留额外开销，不能将两比特直接当作实际端到端内存比例。"], "evidence": [{"source_id": "abstract", "quote": "quantize Transformer-based models to just two bits (plus some overhead)"}], "uncertainties": ["仅阅读摘要；实际额外存储、算子开销和端到端延迟尚需正文核对。", "不同Transformer任务和大规模LLM中的精度权衡尚未核对。", "现场展示、时间、地点和作者到场均未核实。"], "evidence_status": "sufficient", "priority": 1}, "topic_labels": ["以量化降低 Transformer/大语言模型推理的计算与内存成本"], "reading_status": "unread", "user_notes": ""}, {"id": "pmlr:235:adhikary24a", "title": "BeigeMaps: Behavioral Eigenmaps for Reinforcement Learning from Images", "authors": ["Sandesh Adhikary", "Anqi Li", "Byron Boots"], "abstract": "Training reinforcement learning (RL) agents directly from high-dimensional image observations continues to be a challenging problem. Recent line of work on behavioral distances proposes to learn representations that encode behavioral similarities quantified by the bisimulation metric. By learning an isometric mapping to a lower dimensional space that preserves this metric, such methods attempt to learn representations that group together functionally similar states. However, such an isometric mapping may not exist, making the learning objective ill-defined. We propose an alternative objective that allows distortions in long-range distances, while preserving local metric structure – inducing representations that highlight natural clusters in the state space. This leads to new representations, which we term Behavioral Eigenmaps (BeigeMaps), corresponding to the eigenfunctions of similarity kernels induced by behavioral distances. We empirically demonstrate that when added as a drop-in modification, BeigeMaps improve the policy performance of prior behavioral distance based RL algorithms.", "url": "https://proceedings.mlr.press/v235/adhikary24a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/adhikary24a/adhikary24a.pdf", "acceptance": "accepted", "sources": [{"id": "abstract", "kind": "abstract", "text": "Training reinforcement learning (RL) agents directly from high-dimensional image observations continues to be a challenging problem. Recent line of work on behavioral distances proposes to learn representations that encode behavioral similarities quantified by the bisimulation metric. By learning an isometric mapping to a lower dimensional space that preserves this metric, such methods attempt to learn representations that group together functionally similar states. However, such an isometric mapping may not exist, making the learning objective ill-defined. We propose an alternative objective that allows distortions in long-range distances, while preserving local metric structure – inducing representations that highlight natural clusters in the state space. This leads to new representations, which we term Behavioral Eigenmaps (BeigeMaps), corresponding to the eigenfunctions of similarity kernels induced by behavioral distances. We empirically demonstrate that when added as a drop-in modification, BeigeMaps improve the policy performance of prior behavioral distance based RL algorithms.", "url": "https://proceedings.mlr.press/v235/adhikary24a.html", "locator": "Abstract"}, {"id": "title", "kind": "title", "text": "BeigeMaps: Behavioral Eigenmaps for Reinforcement Learning from Images", "url": "https://proceedings.mlr.press/v235/adhikary24a.html", "locator": "title"}], "display_id": "P-5B14079EE8B4", "assessment": {"paper_id": "pmlr:235:adhikary24a", "decision": "exclude", "relevance": "low", "relation": null, "topic_ids": [], "reason": "BeigeMaps改进图像观测强化学习的状态表示和策略效果；摘要目标为RL表示学习，未给出Transformer/LLM推理成本目标。", "reading_focus": "", "differences": [], "evidence": [{"source_id": "abstract", "quote": "BeigeMaps improve the policy performance of prior behavioral distance based RL algorithms."}], "uncertainties": [], "evidence_status": "sufficient", "priority": 3}, "topic_labels": [], "reading_status": "unread", "user_notes": ""}, {"id": "pmlr:235:adila24a", "title": "Discovering Bias in Latent Space: An Unsupervised Debiasing Approach", "authors": ["Dyah Adila", "Shuai Zhang", "Boran Han", "Bernie Wang"], "abstract": "The question-answering (QA) capabilities of foundation models are highly sensitive to prompt variations, rendering their performance susceptible to superficial, non-meaning-altering changes. This vulnerability often stems from the model’s preference or bias towards specific input characteristics, such as option position or superficial image features in multi-modal settings. We propose to rectify this bias directly in the model’s internal representation. Our approach, SteerFair, finds the bias direction in the model’s representation space and steers activation values away from it during inference. Specifically, we exploit the observation that bias often adheres to simple association rules, such as the spurious association between the first option and correctness likelihood. Next, we construct demonstrations of these rules from unlabeled samples and use them to identify the bias directions. We empirically show that SteerFair significantly reduces instruction-tuned model performance variance across prompt modifications on three benchmark tasks. Remarkably, our approach surpasses a supervised baseline with 100 labels by an average of 10.86% accuracy points and 12.95 score points and matches the performance with 500 labels.", "url": "https://proceedings.mlr.press/v235/adila24a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/adila24a/adila24a.pdf", "acceptance": "accepted", "sources": [{"id": "abstract", "kind": "abstract", "text": "The question-answering (QA) capabilities of foundation models are highly sensitive to prompt variations, rendering their performance susceptible to superficial, non-meaning-altering changes. This vulnerability often stems from the model’s preference or bias towards specific input characteristics, such as option position or superficial image features in multi-modal settings. We propose to rectify this bias directly in the model’s internal representation. Our approach, SteerFair, finds the bias direction in the model’s representation space and steers activation values away from it during inference. Specifically, we exploit the observation that bias often adheres to simple association rules, such as the spurious association between the first option and correctness likelihood. Next, we construct demonstrations of these rules from unlabeled samples and use them to identify the bias directions. We empirically show that SteerFair significantly reduces instruction-tuned model performance variance across prompt modifications on three benchmark tasks. Remarkably, our approach surpasses a supervised baseline with 100 labels by an average of 10.86% accuracy points and 12.95 score points and matches the performance with 500 labels.", "url": "https://proceedings.mlr.press/v235/adila24a.html", "locator": "Abstract"}, {"id": "title", "kind": "title", "text": "Discovering Bias in Latent Space: An Unsupervised Debiasing Approach", "url": "https://proceedings.mlr.press/v235/adila24a.html", "locator": "title"}], "display_id": "P-17C6463A102D", "assessment": {"paper_id": "pmlr:235:adila24a", "decision": "exclude", "relevance": "low", "relation": null, "topic_ids": [], "reason": "SteerFair在推理中修改激活以消除提示偏差；虽涉及推理过程，优化目标为偏差和效果稳定性，摘要不支持降低计算或内存成本。", "reading_focus": "", "differences": [], "evidence": [{"source_id": "abstract", "quote": "steers activation values away from it during inference."}], "uncertainties": [], "evidence_status": "sufficient", "priority": 3}, "topic_labels": [], "reading_status": "unread", "user_notes": ""}, {"id": "pmlr:235:afshani24a", "title": "Optimal Coresets for Low-Dimensional Geometric Median", "authors": ["Peyman Afshani", "Chris Schwiegelshohn"], "abstract": "We investigate coresets for approximating the cost with respect to median queries. In this problem, we are given a set of points $P\\subset \\mathbb{R}^d$ and median queries are $\\sum_{p\\in P} ||p-c||$ for any point $c\\in \\mathbb{R}^d$. Our goal is to compute a small weighted summary $S\\subset P$ such that the cost of any median query is approximated within a multiplicative $(1\\pm\\varepsilon)$ factor. We provide matching upper and lower bounds on the number of points contained in $S$ of the order $\\tilde{\\Theta}\\left(\\varepsilon^{-d/(d+1)}\\right)$.", "url": "https://proceedings.mlr.press/v235/afshani24a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/afshani24a/afshani24a.pdf", "acceptance": "accepted", "sources": [{"id": "abstract", "kind": "abstract", "text": "We investigate coresets for approximating the cost with respect to median queries. In this problem, we are given a set of points $P\\subset \\mathbb{R}^d$ and median queries are $\\sum_{p\\in P} ||p-c||$ for any point $c\\in \\mathbb{R}^d$. Our goal is to compute a small weighted summary $S\\subset P$ such that the cost of any median query is approximated within a multiplicative $(1\\pm\\varepsilon)$ factor. We provide matching upper and lower bounds on the number of points contained in $S$ of the order $\\tilde{\\Theta}\\left(\\varepsilon^{-d/(d+1)}\\right)$.", "url": "https://proceedings.mlr.press/v235/afshani24a.html", "locator": "Abstract"}, {"id": "title", "kind": "title", "text": "Optimal Coresets for Low-Dimensional Geometric Median", "url": "https://proceedings.mlr.press/v235/afshani24a.html", "locator": "title"}], "display_id": "P-AD500429EA3C", "assessment": {"paper_id": "pmlr:235:afshani24a", "decision": "exclude", "relevance": "low", "relation": null, "topic_ids": [], "reason": "研究几何中位数查询的coreset大小界；计算对象为几何点集查询，没有Transformer/LLM推理方法或能直接定位的迁移机制。", "reading_focus": "", "differences": [], "evidence": [{"source_id": "abstract", "quote": "We investigate coresets for approximating the cost with respect to median queries."}], "uncertainties": [], "evidence_status": "sufficient", "priority": 3}, "topic_labels": [], "reading_status": "unread", "user_notes": ""}, {"id": "pmlr:235:afzal24a", "title": "REST: Efficient and Accelerated EEG Seizure Analysis through Residual State Updates", "authors": ["Arshia Afzal", "Grigorios Chrysos", "Volkan Cevher", "Mahsa Shoaran"], "abstract": "EEG-based seizure detection models face challenges in terms of inference speed and memory efficiency, limiting their real-time implementation in clinical devices. This paper introduces a novel graph-based residual state update mechanism (REST) for real-time EEG signal analysis in applications such as epileptic seizure detection. By leveraging a combination of graph neural networks and recurrent structures, REST efficiently captures both non-Euclidean geometry and temporal dependencies within EEG data. Our model demonstrates high accuracy in both seizure detection and classification tasks. Notably, REST achieves a remarkable 9-fold acceleration in inference speed compared to state-of-the-art models, while simultaneously demanding substantially less memory than the smallest model employed for this task. These attributes position REST as a promising candidate for real-time implementation in clinical devices, such as Responsive Neurostimulation or seizure alert systems.", "url": "https://proceedings.mlr.press/v235/afzal24a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/afzal24a/afzal24a.pdf", "acceptance": "accepted", "sources": [{"id": "abstract", "kind": "abstract", "text": "EEG-based seizure detection models face challenges in terms of inference speed and memory efficiency, limiting their real-time implementation in clinical devices. This paper introduces a novel graph-based residual state update mechanism (REST) for real-time EEG signal analysis in applications such as epileptic seizure detection. By leveraging a combination of graph neural networks and recurrent structures, REST efficiently captures both non-Euclidean geometry and temporal dependencies within EEG data. Our model demonstrates high accuracy in both seizure detection and classification tasks. Notably, REST achieves a remarkable 9-fold acceleration in inference speed compared to state-of-the-art models, while simultaneously demanding substantially less memory than the smallest model employed for this task. These attributes position REST as a promising candidate for real-time implementation in clinical devices, such as Responsive Neurostimulation or seizure alert systems.", "url": "https://proceedings.mlr.press/v235/afzal24a.html", "locator": "Abstract"}, {"id": "title", "kind": "title", "text": "REST: Efficient and Accelerated EEG Seizure Analysis through Residual State Updates", "url": "https://proceedings.mlr.press/v235/afzal24a.html", "locator": "title"}], "display_id": "P-924393848E1D", "assessment": {"paper_id": "pmlr:235:afzal24a", "decision": "exclude", "relevance": "low", "relation": null, "topic_ids": [], "reason": "REST确实优化推理速度与内存，但目标为EEG临床信号上的图网络和循环结构；现有摘要不能支持与Transformer/LLM量化、attention或服务系统的具体方法关联。", "reading_focus": "", "differences": ["未因缺少关键词而排除：其推理效率目标已识别，但目标模型和机制超出本次明确研究问题。"], "evidence": [{"source_id": "abstract", "quote": "graph-based residual state update mechanism (REST) for real-time EEG signal analysis"}], "uncertainties": [], "evidence_status": "sufficient", "priority": 3}, "topic_labels": [], "reading_status": "unread", "user_notes": ""}, {"id": "pmlr:235:agarwal24a", "title": "CHAI: Clustered Head Attention for Efficient LLM Inference", "authors": ["Saurabh Agarwal", "Bilge Acun", "Basil Hosmer", "Mostafa Elhoushi", "Yejin Lee", "Shivaram Venkataraman", "Dimitris Papailiopoulos", "Carole-Jean Wu"], "abstract": "Large Language Models (LLMs) with hundreds of billions of parameters have transformed the field of machine learning. However, serving these models at inference time is both compute and memory intensive, where a single request can require multiple GPUs and tens of Gigabytes of memory. Multi-head attention is one of the key components of LLMs, which can for over 50% of LLMs memory and compute requirement. We observe that there is a high amount of redundancy across heads on which tokens they pay attention to. Based on this insight, we propose Clustered HeadAttention ( CHAI ). CHAI combines heads with a high amount of correlation for self-attention at runtime, thus reducing both memory and compute. In our experiments, we show that CHAI is able to reduce the memory requirements for storing K,V cache by up to 21.4% and inference time latency by up to 1.73× without any fine-tuning required. CHAI achieves this with a maximum 3.2% deviation in accuracy across 3 different models (i.e. OPT-66B, LLAMA-7B, LLAMA-33B) and 5 different evaluation datasets.", "url": "https://proceedings.mlr.press/v235/agarwal24a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/agarwal24a/agarwal24a.pdf", "acceptance": "accepted", "sources": [{"id": "abstract", "kind": "abstract", "text": "Large Language Models (LLMs) with hundreds of billions of parameters have transformed the field of machine learning. However, serving these models at inference time is both compute and memory intensive, where a single request can require multiple GPUs and tens of Gigabytes of memory. Multi-head attention is one of the key components of LLMs, which can for over 50% of LLMs memory and compute requirement. We observe that there is a high amount of redundancy across heads on which tokens they pay attention to. Based on this insight, we propose Clustered HeadAttention ( CHAI ). CHAI combines heads with a high amount of correlation for self-attention at runtime, thus reducing both memory and compute. In our experiments, we show that CHAI is able to reduce the memory requirements for storing K,V cache by up to 21.4% and inference time latency by up to 1.73× without any fine-tuning required. CHAI achieves this with a maximum 3.2% deviation in accuracy across 3 different models (i.e. OPT-66B, LLAMA-7B, LLAMA-33B) and 5 different evaluation datasets.", "url": "https://proceedings.mlr.press/v235/agarwal24a.html", "locator": "Abstract"}, {"id": "title", "kind": "title", "text": "CHAI: Clustered Head Attention for Efficient LLM Inference", "url": "https://proceedings.mlr.press/v235/agarwal24a.html", "locator": "title"}], "display_id": "P-07B46CD2B3FA", "assessment": {"paper_id": "pmlr:235:agarwal24a", "decision": "include", "relevance": "high", "relation": "direct", "topic_ids": ["attention"], "reason": "CHAI识别LLM注意力头之间的相关冗余，在运行时合并头，明确同时降低attention计算与KV cache内存，直接匹配高效推理问题。", "reading_focus": "优先阅读头相关性估计、运行时聚类及KV cache组织；核查额外聚类成本、输入长度与批量变化，以及各模型精度和延迟测量。", "differences": ["以运行时注意力冗余为切入点，不要求先微调；与FrameQuant的参数表示压缩和LeaPformer的线性attention设计不同。"], "evidence": [{"source_id": "abstract", "quote": "correlation for self-attention at runtime, thus reducing both memory and compute."}], "uncertainties": ["仅阅读摘要；报告的缓存和延迟收益尚未核对正文实验条件。", "不同序列长度和负载下的聚类成本及精度变化仍待核查。", "现场展示、时间、地点和作者到场均未核实。"], "evidence_status": "sufficient", "priority": 1}, "topic_labels": ["以高效注意力降低 Transformer/大语言模型推理的计算与内存成本"], "reading_status": "unread", "user_notes": ""}, {"id": "pmlr:235:agarwal24b", "title": "Learning to Play Atari in a World of Tokens", "authors": ["Pranav Agarwal", "Sheldon Andrews", "Samira Ebrahimi Kahou"], "abstract": "Model-based reinforcement learning agents utilizing transformers have shown improved sample efficiency due to their ability to model extended context, resulting in more accurate world models. However, for complex reasoning and planning tasks, these methods primarily rely on continuous representations. This complicates modeling of discrete properties of the real world such as disjoint object classes between which interpolation is not plausible. In this work, we introduce discrete abstract representations for transformer-based learning (DART), a sample-efficient method utilizing discrete representations for modeling both the world and learning behavior. We incorporate a transformer-decoder for auto-regressive world modeling and a transformer-encoder for learning behavior by attending to task-relevant cues in the discrete representation of the world model. For handling partial observability, we aggregate information from past time steps as memory tokens. DART outperforms previous state-of-the-art methods that do not use look-ahead search on the Atari 100k sample efficiency benchmark with a median human-normalized score of 0.790 and beats humans in 9 out of 26 games. We release our code at https://pranaval.github.io/DART/.", "url": "https://proceedings.mlr.press/v235/agarwal24b.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/agarwal24b/agarwal24b.pdf", "acceptance": "accepted", "sources": [{"id": "abstract", "kind": "abstract", "text": "Model-based reinforcement learning agents utilizing transformers have shown improved sample efficiency due to their ability to model extended context, resulting in more accurate world models. However, for complex reasoning and planning tasks, these methods primarily rely on continuous representations. This complicates modeling of discrete properties of the real world such as disjoint object classes between which interpolation is not plausible. In this work, we introduce discrete abstract representations for transformer-based learning (DART), a sample-efficient method utilizing discrete representations for modeling both the world and learning behavior. We incorporate a transformer-decoder for auto-regressive world modeling and a transformer-encoder for learning behavior by attending to task-relevant cues in the discrete representation of the world model. For handling partial observability, we aggregate information from past time steps as memory tokens. DART outperforms previous state-of-the-art methods that do not use look-ahead search on the Atari 100k sample efficiency benchmark with a median human-normalized score of 0.790 and beats humans in 9 out of 26 games. We release our code at https://pranaval.github.io/DART/.", "url": "https://proceedings.mlr.press/v235/agarwal24b.html", "locator": "Abstract"}, {"id": "title", "kind": "title", "text": "Learning to Play Atari in a World of Tokens", "url": "https://proceedings.mlr.press/v235/agarwal24b.html", "locator": "title"}], "display_id": "P-2FF51A50F7B9", "assessment": {"paper_id": "pmlr:235:agarwal24b", "decision": "exclude", "relevance": "low", "relation": null, "topic_ids": [], "reason": "DART用离散表示和Transformer改善Atari强化学习的样本效率；摘要中的memory tokens用于部分可观测状态记忆，未构成LLM推理内存节约机制。", "reading_focus": "", "differences": [], "evidence": [{"source_id": "abstract", "quote": "a sample-efficient method utilizing discrete representations for modeling both the world and learning behavior."}], "uncertainties": [], "evidence_status": "sufficient", "priority": 3}, "topic_labels": [], "reading_status": "unread", "user_notes": ""}, {"id": "pmlr:235:agarwal24c", "title": "Probabilistic Generating Circuits - Demystified", "authors": ["Sanyam Agarwal", "Markus Bläser"], "abstract": "Zhang et al. (ICML 2021, PLMR 139, pp. 12447–12457) introduced probabilistic generating circuits (PGCs) as a probabilistic model to unify probabilistic circuits (PCs) and determinantal point processes (DPPs). At a first glance, PGCs store a distribution in a very different way, they compute the probability generating polynomial instead of the probability mass function and it seems that this is the main reason why PGCs are more powerful than PCs or DPPs. However, PGCs also allow for negative weights, whereas classical PCs assume that all weights are nonnegative. One main insight of this work is that the negative weights are the cause for the power of PGCs and not the different representation. PGCs are PCs in disguise: we show how to transform any PGC on binary variables into a PC with negative weights with only polynomial blowup. PGCs were defined by Zhang et al. only for binary random variables. As our second main result, we show that there is a good reason for this: we prove that PGCs for categorical variables with larger image size do not support tractable marginalization unless NP=P. On the other hand, we show that we can model categorical variables with larger image size as PC with negative weights computing set-multilinear polynomials. These allow for tractable marginalization. In this sense, PCs with negative weights strictly subsume PGCs.", "url": "https://proceedings.mlr.press/v235/agarwal24c.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/agarwal24c/agarwal24c.pdf", "acceptance": "accepted", "sources": [{"id": "abstract", "kind": "abstract", "text": "Zhang et al. (ICML 2021, PLMR 139, pp. 12447–12457) introduced probabilistic generating circuits (PGCs) as a probabilistic model to unify probabilistic circuits (PCs) and determinantal point processes (DPPs). At a first glance, PGCs store a distribution in a very different way, they compute the probability generating polynomial instead of the probability mass function and it seems that this is the main reason why PGCs are more powerful than PCs or DPPs. However, PGCs also allow for negative weights, whereas classical PCs assume that all weights are nonnegative. One main insight of this work is that the negative weights are the cause for the power of PGCs and not the different representation. PGCs are PCs in disguise: we show how to transform any PGC on binary variables into a PC with negative weights with only polynomial blowup. PGCs were defined by Zhang et al. only for binary random variables. As our second main result, we show that there is a good reason for this: we prove that PGCs for categorical variables with larger image size do not support tractable marginalization unless NP=P. On the other hand, we show that we can model categorical variables with larger image size as PC with negative weights computing set-multilinear polynomials. These allow for tractable marginalization. In this sense, PCs with negative weights strictly subsume PGCs.", "url": "https://proceedings.mlr.press/v235/agarwal24c.html", "locator": "Abstract"}, {"id": "title", "kind": "title", "text": "Probabilistic Generating Circuits - Demystified", "url": "https://proceedings.mlr.press/v235/agarwal24c.html", "locator": "title"}], "display_id": "P-3901C1DF6943", "assessment": {"paper_id": "pmlr:235:agarwal24c", "decision": "exclude", "relevance": "low", "relation": null, "topic_ids": [], "reason": "分析概率生成电路与概率电路的表达能力和边缘化复杂度；虽有可计算推断目标，但不是Transformer/LLM attention或推理系统，未提供具体可迁移方法。", "reading_focus": "", "differences": [], "evidence": [{"source_id": "abstract", "quote": "PGCs are PCs in disguise: we show how to transform any PGC on binary variables into a PC with negative weights with only polynomial blowup."}], "uncertainties": [], "evidence_status": "sufficient", "priority": 3}, "topic_labels": [], "reading_status": "unread", "user_notes": ""}, {"id": "pmlr:235:agarwal24d", "title": "Improved Differentially Private and Lazy Online Convex Optimization: Lower Regret without Smoothness Requirements", "authors": ["Naman Agarwal", "Satyen Kale", "Karan Singh", "Abhradeep Guha Thakurta"], "abstract": "We design differentially private regret-minimizing algorithms in the online convex optimization (OCO) framework. Unlike recent results, our algorithms and analyses do not require smoothness, thus yielding the first private regret bounds with an optimal leading-order term for non-smooth loss functions. Additionally, even for smooth losses, the resulting regret guarantees improve upon previous results in terms their dependence of dimension. Our results provide the best known rates for DP-OCO in all practical regimes of the privacy parameter, barring when it is exceptionally small. The principal innovation in our algorithm design is the use of sampling from strongly log-concave densities which satisfy the Log-Sobolev Inequality. The resulting concentration of measure allows us to obtain a better trade-off for the dimension factors than prior work, leading to improved results. Following previous works on DP-OCO, the proposed algorithm explicitly limits the number of switches via rejection sampling. Thus, independently of privacy constraints, the algorithm also provides improved results for online convex optimization with a switching budget.", "url": "https://proceedings.mlr.press/v235/agarwal24d.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/agarwal24d/agarwal24d.pdf", "acceptance": "accepted", "sources": [{"id": "abstract", "kind": "abstract", "text": "We design differentially private regret-minimizing algorithms in the online convex optimization (OCO) framework. Unlike recent results, our algorithms and analyses do not require smoothness, thus yielding the first private regret bounds with an optimal leading-order term for non-smooth loss functions. Additionally, even for smooth losses, the resulting regret guarantees improve upon previous results in terms their dependence of dimension. Our results provide the best known rates for DP-OCO in all practical regimes of the privacy parameter, barring when it is exceptionally small. The principal innovation in our algorithm design is the use of sampling from strongly log-concave densities which satisfy the Log-Sobolev Inequality. The resulting concentration of measure allows us to obtain a better trade-off for the dimension factors than prior work, leading to improved results. Following previous works on DP-OCO, the proposed algorithm explicitly limits the number of switches via rejection sampling. Thus, independently of privacy constraints, the algorithm also provides improved results for online convex optimization with a switching budget.", "url": "https://proceedings.mlr.press/v235/agarwal24d.html", "locator": "Abstract"}, {"id": "title", "kind": "title", "text": "Improved Differentially Private and Lazy Online Convex Optimization: Lower Regret without Smoothness Requirements", "url": "https://proceedings.mlr.press/v235/agarwal24d.html", "locator": "title"}], "display_id": "P-3BEC21EF18D1", "assessment": {"paper_id": "pmlr:235:agarwal24d", "decision": "exclude", "relevance": "low", "relation": null, "topic_ids": [], "reason": "目标是差分隐私在线凸优化的regret与切换预算；摘要不涉及Transformer/LLM部署推理的计算或内存机制。", "reading_focus": "", "differences": [], "evidence": [{"source_id": "abstract", "quote": "We design differentially private regret-minimizing algorithms in the online convex optimization (OCO) framework."}], "uncertainties": [], "evidence_status": "sufficient", "priority": 3}, "topic_labels": [], "reading_status": "unread", "user_notes": ""}, {"id": "pmlr:235:agarwal24e", "title": "The Non-linear $F$-Design and Applications to Interactive Learning", "authors": ["Alekh Agarwal", "Jian Qian", "Alexander Rakhlin", "Tong Zhang"], "abstract": "We propose a generalization of the classical G-optimal design concept to non-linear function classes. The criterion, termed F -design, coincides with G-design in the linear case. We compute the value of the optimal design, termed the F-condition number, for several non-linear function classes. We further provide algorithms to construct designs with a bounded F -condition number. Finally, we employ the F-design in a variety of interactive machine learning tasks, where the design is naturally useful for data collection or exploration. We show that in four diverse settings of confidence band construction, contextual bandits, model-free reinforcement learning, and active learning, F-design can be combined with existing approaches in a black-box manner to yield state-of-the-art results in known problem settings as well as to generalize to novel ones.", "url": "https://proceedings.mlr.press/v235/agarwal24e.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/agarwal24e/agarwal24e.pdf", "acceptance": "accepted", "sources": [{"id": "abstract", "kind": "abstract", "text": "We propose a generalization of the classical G-optimal design concept to non-linear function classes. The criterion, termed F -design, coincides with G-design in the linear case. We compute the value of the optimal design, termed the F-condition number, for several non-linear function classes. We further provide algorithms to construct designs with a bounded F -condition number. Finally, we employ the F-design in a variety of interactive machine learning tasks, where the design is naturally useful for data collection or exploration. We show that in four diverse settings of confidence band construction, contextual bandits, model-free reinforcement learning, and active learning, F-design can be combined with existing approaches in a black-box manner to yield state-of-the-art results in known problem settings as well as to generalize to novel ones.", "url": "https://proceedings.mlr.press/v235/agarwal24e.html", "locator": "Abstract"}, {"id": "title", "kind": "title", "text": "The Non-linear $F$-Design and Applications to Interactive Learning", "url": "https://proceedings.mlr.press/v235/agarwal24e.html", "locator": "title"}], "display_id": "P-7698FEAB0343", "assessment": {"paper_id": "pmlr:235:agarwal24e", "decision": "exclude", "relevance": "low", "relation": null, "topic_ids": [], "reason": "F-design服务交互学习中的数据采集与探索；非线性实验设计理论未在摘要中给出Transformer/LLM推理成本关联。", "reading_focus": "", "differences": [], "evidence": [{"source_id": "abstract", "quote": "the design is naturally useful for data collection or exploration."}], "uncertainties": [], "evidence_status": "sufficient", "priority": 3}, "topic_labels": [], "reading_status": "unread", "user_notes": ""}, {"id": "pmlr:235:agnihotri24a", "title": "ACPO: A Policy Optimization Algorithm for Average MDPs with Constraints", "authors": ["Akhil Agnihotri", "Rahul Jain", "Haipeng Luo"], "abstract": "Reinforcement Learning (RL) for constrained MDPs (CMDPs) is an increasingly important problem for various applications. Often, the average criterion is more suitable than the discounted criterion. Yet, RL for average-CMDPs (ACMDPs) remains a challenging problem. Algorithms designed for discounted constrained RL problems often do not perform well for the average CMDP setting. In this paper, we introduce a new policy optimization with function approximation algorithm for constrained MDPs with the average criterion. The Average-Constrained Policy Optimization (ACPO) algorithm is inspired by trust region-based policy optimization algorithms. We develop basic sensitivity theory for average CMDPs, and then use the corresponding bounds in the design of the algorithm. We provide theoretical guarantees on its performance, and through extensive experimental work in various challenging OpenAI Gym environments, show its superior empirical performance when compared to other state-of-the-art algorithms adapted for the ACMDPs.", "url": "https://proceedings.mlr.press/v235/agnihotri24a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/agnihotri24a/agnihotri24a.pdf", "acceptance": "accepted", "sources": [{"id": "abstract", "kind": "abstract", "text": "Reinforcement Learning (RL) for constrained MDPs (CMDPs) is an increasingly important problem for various applications. Often, the average criterion is more suitable than the discounted criterion. Yet, RL for average-CMDPs (ACMDPs) remains a challenging problem. Algorithms designed for discounted constrained RL problems often do not perform well for the average CMDP setting. In this paper, we introduce a new policy optimization with function approximation algorithm for constrained MDPs with the average criterion. The Average-Constrained Policy Optimization (ACPO) algorithm is inspired by trust region-based policy optimization algorithms. We develop basic sensitivity theory for average CMDPs, and then use the corresponding bounds in the design of the algorithm. We provide theoretical guarantees on its performance, and through extensive experimental work in various challenging OpenAI Gym environments, show its superior empirical performance when compared to other state-of-the-art algorithms adapted for the ACMDPs.", "url": "https://proceedings.mlr.press/v235/agnihotri24a.html", "locator": "Abstract"}, {"id": "title", "kind": "title", "text": "ACPO: A Policy Optimization Algorithm for Average MDPs with Constraints", "url": "https://proceedings.mlr.press/v235/agnihotri24a.html", "locator": "title"}], "display_id": "P-8C0B8ED71EE2", "assessment": {"paper_id": "pmlr:235:agnihotri24a", "decision": "exclude", "relevance": "low", "relation": null, "topic_ids": [], "reason": "ACPO优化有约束平均MDP策略，贡献为强化学习算法及其保证；摘要没有Transformer/LLM推理计算或内存成本问题。", "reading_focus": "", "differences": [], "evidence": [{"source_id": "abstract", "quote": "a new policy optimization with function approximation algorithm for constrained MDPs with the average criterion."}], "uncertainties": [], "evidence_status": "sufficient", "priority": 3}, "topic_labels": [], "reading_status": "unread", "user_notes": ""}, {"id": "pmlr:235:agnihotri24b", "title": "CosPGD: an efficient white-box adversarial attack for pixel-wise prediction tasks", "authors": ["Shashank Agnihotri", "Steffen Jung", "Margret Keuper"], "abstract": "While neural networks allow highly accurate predictions in many tasks, their lack of robustness towards even slight input perturbations often hampers their deployment. Adversarial attacks such as the seminal projected gradient descent (PGD) offer an effective means to evaluate a model’s robustness and dedicated solutions have been proposed for attacks on semantic segmentation or optical flow estimation. While they attempt to increase the attack’s efficiency, a further objective is to balance its effect, so that it acts on the entire image domain instead of isolated point-wise predictions. This often comes at the cost of optimization stability and thus efficiency. Here, we propose CosPGD, an attack that encourages more balanced errors over the entire image domain while increasing the attack’s overall efficiency. To this end, CosPGD leverages a simple alignment score computed from any pixel-wise prediction and its target to scale the loss in a smooth and fully differentiable way. It leads to efficient evaluations of a model’s robustness for semantic segmentation as well as regression models (such as optical flow, disparity estimation, or image restoration), and it allows it to outperform the previous SotA attack on semantic segmentation. We provide code for the CosPGD algorithm and example usage at https://github.com/shashankskagnihotri/cospgd.", "url": "https://proceedings.mlr.press/v235/agnihotri24b.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/agnihotri24b/agnihotri24b.pdf", "acceptance": "accepted", "sources": [{"id": "abstract", "kind": "abstract", "text": "While neural networks allow highly accurate predictions in many tasks, their lack of robustness towards even slight input perturbations often hampers their deployment. Adversarial attacks such as the seminal projected gradient descent (PGD) offer an effective means to evaluate a model’s robustness and dedicated solutions have been proposed for attacks on semantic segmentation or optical flow estimation. While they attempt to increase the attack’s efficiency, a further objective is to balance its effect, so that it acts on the entire image domain instead of isolated point-wise predictions. This often comes at the cost of optimization stability and thus efficiency. Here, we propose CosPGD, an attack that encourages more balanced errors over the entire image domain while increasing the attack’s overall efficiency. To this end, CosPGD leverages a simple alignment score computed from any pixel-wise prediction and its target to scale the loss in a smooth and fully differentiable way. It leads to efficient evaluations of a model’s robustness for semantic segmentation as well as regression models (such as optical flow, disparity estimation, or image restoration), and it allows it to outperform the previous SotA attack on semantic segmentation. We provide code for the CosPGD algorithm and example usage at https://github.com/shashankskagnihotri/cospgd.", "url": "https://proceedings.mlr.press/v235/agnihotri24b.html", "locator": "Abstract"}, {"id": "title", "kind": "title", "text": "CosPGD: an efficient white-box adversarial attack for pixel-wise prediction tasks", "url": "https://proceedings.mlr.press/v235/agnihotri24b.html", "locator": "title"}], "display_id": "P-C41591EB6346", "assessment": {"paper_id": "pmlr:235:agnihotri24b", "decision": "exclude", "relevance": "low", "relation": null, "topic_ids": [], "reason": "CosPGD改善像素级预测任务的白盒对抗攻击与鲁棒性评估效率；攻击计算效率并非模型正常推理的计算或内存降低。", "reading_focus": "", "differences": [], "evidence": [{"source_id": "abstract", "quote": "CosPGD, an attack that encourages more balanced errors over the entire image domain while increasing the attack’s overall efficiency."}], "uncertainties": [], "evidence_status": "sufficient", "priority": 3}, "topic_labels": [], "reading_status": "unread", "user_notes": ""}, {"id": "pmlr:235:agostinelli-iii24a", "title": "LeaPformer: Enabling Linear Transformers for Autoregressive and Simultaneous Tasks via Learned Proportions", "authors": ["Victor Agostinelli Iii", "Sanghyun Hong", "Lizhong Chen"], "abstract": "A promising approach to preserving model performance in linearized transformers is to employ position-based re-weighting functions. However, state-of-the-art re-weighting functions rely heavily on target sequence lengths, making it difficult or impossible to apply them to autoregressive and simultaneous tasks, where the target and sometimes even the input sequence length are unknown. To address this issue, we propose Learned Proportions (LeaP) and LeaPformers. Our contribution is built on two major components. First, we generalize the dependence on explicit positional representations and sequence lengths into dependence on sequence proportions for re-weighting. Second, we replace static positional representations with dynamic proportions derived via a compact module, enabling more flexible attention concentration patterns. We evaluate LeaPformer against eight representative efficient transformers on the Long-Range Arena benchmark, where we show that LeaPformer achieves the best quality-throughput trade-off, as well as apply LeaPformer to Wikitext-103b autoregressive language modeling and simultaneous speech-to-text translation for two language pairs, achieving competitive results in both tasks.", "url": "https://proceedings.mlr.press/v235/agostinelli-iii24a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/agostinelli-iii24a/agostinelli-iii24a.pdf", "acceptance": "accepted", "sources": [{"id": "abstract", "kind": "abstract", "text": "A promising approach to preserving model performance in linearized transformers is to employ position-based re-weighting functions. However, state-of-the-art re-weighting functions rely heavily on target sequence lengths, making it difficult or impossible to apply them to autoregressive and simultaneous tasks, where the target and sometimes even the input sequence length are unknown. To address this issue, we propose Learned Proportions (LeaP) and LeaPformers. Our contribution is built on two major components. First, we generalize the dependence on explicit positional representations and sequence lengths into dependence on sequence proportions for re-weighting. Second, we replace static positional representations with dynamic proportions derived via a compact module, enabling more flexible attention concentration patterns. We evaluate LeaPformer against eight representative efficient transformers on the Long-Range Arena benchmark, where we show that LeaPformer achieves the best quality-throughput trade-off, as well as apply LeaPformer to Wikitext-103b autoregressive language modeling and simultaneous speech-to-text translation for two language pairs, achieving competitive results in both tasks.", "url": "https://proceedings.mlr.press/v235/agostinelli-iii24a.html", "locator": "Abstract"}, {"id": "title", "kind": "title", "text": "LeaPformer: Enabling Linear Transformers for Autoregressive and Simultaneous Tasks via Learned Proportions", "url": "https://proceedings.mlr.press/v235/agostinelli-iii24a.html", "locator": "title"}], "display_id": "P-0E78607BC365", "assessment": {"paper_id": "pmlr:235:agostinelli-iii24a", "decision": "include", "relevance": "medium", "relation": "direct", "topic_ids": ["attention"], "reason": "LeaPformer解决线性化Transformer的重加权函数依赖目标序列长度，妨碍自回归与同步任务的问题。其动态比例机制使高效attention能用于长度未知的推理场景；摘要明确包含自回归语言建模验证。", "reading_focus": "优先查阅线性attention重加权及动态比例模块，检查自回归增量计算是否可缓存；核查吞吐指标的测量条件和部署相对标准Transformer的开销。", "differences": ["属于attention架构设计，可在训练后服务自回归任务；用户排除的是没有推理价值的训练优化，并不排除需训练的新架构。", "摘要中的语言建模规模不能外推为大规模LLM部署实测；与CHAI的运行时头合并不同。"], "evidence": [{"source_id": "abstract", "quote": "dynamic proportions derived via a compact module, enabling more flexible attention concentration patterns."}], "uncertainties": ["仅阅读摘要；自回归实验中的推理吞吐和内存收益需正文核对。", "大规模预训练LLM的适配、权重复用及硬件实现尚未确认。"], "evidence_status": "sufficient", "priority": 2}, "topic_labels": ["以高效注意力降低 Transformer/大语言模型推理的计算与内存成本"], "reading_status": "unread", "user_notes": ""}]}</script>
<script>
"use strict";
(() => {
const data = JSON.parse(document.getElementById("report-data").textContent);
const metadata = data.metadata || {}, coverage = data.coverage || {}, overview = data.overview || {};
const papers = Array.isArray(data.papers) ? data.papers : [];
const topics = Array.isArray((data.profile || {}).topics) ? data.profile.topics : [];
const topicById = new Map(topics.map(t => [String(t.id), t]));
const paperById = new Map(papers.map(p => [String(p.id), p]));
const relationNames = {direct:"直接相关", method_transfer:"方法可借鉴", adjacent:"邻近方向"};
const priorityNames = {1:"优先阅读", 2:"补充阅读", 3:"探索阅读"};
const stateNames = {include:"已推荐", pending:"待核查", exclude:"已排除", unprocessed:"未处理"};
const evidenceNames = {sufficient:"依据充分", limited:"依据有限", missing:"依据待补充"};
const acceptanceNames = {accepted:"已录用", rejected:"未录用", withdrawn:"已撤回", unknown:"录用状态未知"};
const relevanceNames = {high:"高相关", medium:"中相关", low:"低相关", unknown:"相关性待定"};
const $ = id => document.getElementById(id);
const list = value => Array.isArray(value) ? value : [];
const string = value => value == null ? "" : String(value);
const stateOf = p => p.assessment ? (p.assessment.decision || "unprocessed") : "unprocessed";
const rankOf = p => Number((p.assessment || {}).priority) || 4;
const idOf = p => string(p.display_id || p.id);
const recommendedOrder = new Map(list(metadata.recommended_ids).map((id,index)=>[string(id),index]));
const defaultSort = (a,b) => {
  const aIndex=recommendedOrder.get(string(a.id)), bIndex=recommendedOrder.get(string(b.id));
  if(aIndex != null || bIndex != null) return (aIndex == null ? Infinity : aIndex)-(bIndex == null ? Infinity : bIndex);
  return rankOf(a)-rankOf(b) || idOf(a).localeCompare(idOf(b));
};
const topK = Math.max(1, Number(metadata.top_k) || 20);
const included = papers.filter(p => stateOf(p) === "include").sort(defaultSort);
const selectedIds = new Set(Array.isArray(metadata.selected_ids) ? metadata.selected_ids : included.slice(0,topK).map(p => p.id));
let view = metadata.mode === "attend" ? "selected" : "all";
let toastTimer = null;
const storageKey = "conference-paper-search:v1:" + [metadata.conference,metadata.year,metadata.source_url].map(string).join("|");
let readingMarks = {}, storageAvailable = true;
try { readingMarks = JSON.parse(localStorage.getItem(storageKey) || "{}"); if (!readingMarks || typeof readingMarks !== "object" || Array.isArray(readingMarks)) readingMarks = {}; }
catch (_) { storageAvailable = false; }
if (!storageAvailable) $("reading-note").textContent = "当前浏览器不支持保存阅读标记；本次打开期间可以使用，关闭后可能丢失。标记不会自动同步到其他文档。";

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = string(text);
  return node;
}
function safeUrl(raw) {
  if (typeof raw !== "string" || !raw || /[\s\u0000-\u001f\u007f]/.test(raw)) return null;
  try { const url = new URL(raw); return ["http:","https:"].includes(url.protocol) && !url.username && !url.password && url.hostname ? url.href : null; }
  catch (_) { return null; }
}
function link(label, raw) {
  const url = safeUrl(raw);
  if (!url) return null;
  const node = element("a", "", label); node.href = url; node.target = "_blank"; node.rel = "noopener noreferrer"; return node;
}
function addLink(parent, label, raw) { const node = link(label,raw); if (node) parent.append(node); }
function appendBadge(parent, text, type) { if (text) parent.append(element("span","badge" + (type ? " " + type : ""),text)); }
function showToast(message) {
  const toast = $("toast"); toast.textContent = message; toast.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.hidden = true; },2600);
}
async function copyId(p) {
  const text = idOf(p);
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); showToast("已复制 " + text); return; } } catch (_) {}
  const helper = element("textarea","",text); helper.style.position="fixed"; helper.style.left="-9999px"; document.body.append(helper); helper.select();
  let copied = false; try { copied = document.execCommand("copy"); } catch (_) {} helper.remove();
  if (copied) showToast("已复制 " + text); else window.prompt("复制固定 ID：",text);
}
function topicName(id) { const topic = topicById.get(string(id)); return topic ? string(topic.problem || topic.id) : string(id); }
function labelsFor(p) { const labels = list(p.topic_labels); return labels.length ? labels.map(string) : list((p.assessment || {}).topic_ids).map(topicName); }
function section(parent, heading, value, wide) {
  if (value == null || value === "" || (Array.isArray(value) && !value.length)) return;
  const node = element("div","detail-section" + (wide ? " wide" : "")); node.append(element("h4","",heading));
  if (Array.isArray(value)) { const ul=element("ul"); value.forEach(item=>ul.append(element("li","",item))); node.append(ul); }
  else node.append(element("p","",value)); parent.append(node); return node;
}
function saveMark(p, value) {
  readingMarks[p.id] = value;
  try { localStorage.setItem(storageKey,JSON.stringify(readingMarks)); }
  catch (_) { storageAvailable = false; $("reading-note").textContent = "阅读标记仅在本次打开期间保留；浏览器未能保存。标记不会自动同步到 JSON 或其他文档。"; }
  if ($("reading-filter").value) render();
}

const conferenceTitle = [metadata.conference_label || metadata.conference,metadata.year].filter(v=>v != null && v !== "").join(" ") || "会议论文";
$("report-title").textContent = conferenceTitle;
$("report-mode").textContent = metadata.mode === "attend" ? "参会阅读清单" : "会后方向总结";
$("lead").textContent = overview.lead || (metadata.mode === "attend" ? "按研究兴趣定位优先阅读的论文，核对推荐依据，并在官方日程已验证时查看展示信息。" : "按研究兴趣查看本次范围内的相关工作，沿子方向浏览论文，并展开推荐依据与阅读建议。");
const metaNode = $("metadata");
metaNode.append(element("span","", "范围：" + (metadata.track === "main" ? "主会" : string(metadata.track || "未指定"))));
if (metadata.retrieved_at) metaNode.append(element("span","","获取日期：" + string(metadata.retrieved_at).slice(0,10)));
addLink(metaNode,"官方来源",metadata.source_url);
const interestNode = $("interest-topics");
if (!topics.length) interestNode.append(element("p","","未提供研究兴趣描述。"));
topics.forEach(t => {
  const node = element("div","interest-item"); node.append(element("strong","",t.problem || t.id));
  if (list(t.focus).length) node.append(element("p","","关注："+t.focus.join(" · ")));
  if (list(t.constraints).length) node.append(element("p","","约束："+t.constraints.join("；")));
  if (list(t.exclude).length) node.append(element("p","","暂不关注："+t.exclude.join("；")));
  const provenance = list(t.provenance).map(x=>x.kind === "user" ? "用户描述" : x.kind === "publication_inference" ? "论文推断" : string(x.kind)).filter(Boolean);
  if (provenance.length) node.append(element("p","","方向来源："+Array.from(new Set(provenance)).join("、")));
  interestNode.append(node);
});
const countState = state => papers.filter(p=>stateOf(p)===state).length;
const total = coverage.total_papers == null ? papers.length : coverage.total_papers;
const processed = coverage.processed == null ? papers.length-countState("unprocessed") : coverage.processed;
const counts = [
  [total,"本次范围论文",""],
  [coverage.included == null ? countState("include") : coverage.included,"已推荐","primary"],
  [coverage.pending == null ? countState("pending") : coverage.pending,"待核查",""],
  [coverage.unprocessed == null ? countState("unprocessed") : coverage.unprocessed,"未处理",""],
  [coverage.excluded == null ? countState("exclude") : coverage.excluded,"已排除",""]
];
counts.forEach(([n,label,style])=>{ const stat=element("div","stat"+(style?" "+style:""));stat.append(element("strong","",n),element("span","",label));$("stats").append(stat); });
const notes = [metadata.scope_note, "已处理 " + processed + " 篇。未处理与待核查均不等于不相关；默认目录展示已推荐论文。"].filter(Boolean);
const missingAbstracts = coverage.missing_abstract == null ? papers.filter(p=>!p.abstract).length : coverage.missing_abstract;
if (missingAbstracts) notes.push("缺失摘要 " + missingAbstracts + " 篇。");
$("coverage-note").textContent = notes.join(" ");
topics.forEach(t=>{ const opt=element("option","",t.problem||t.id);opt.value=string(t.id);$("topic-filter").append(opt); });
const themeList = list(overview.themes);
if (themeList.length) {
  $("overview").hidden=false;
  themeList.forEach(theme=>{
    const card=element("article","theme");card.append(element("h3","",topicName(theme.topic_id)),element("p","",theme.text));
    const refs=element("div","inline-ids");
    list(theme.paper_ids).forEach(id=>{const p=paperById.get(string(id));if(!p)return;const b=element("button","text-button",idOf(p));b.type="button";b.title=string(p.title);b.addEventListener("click",()=>jumpToPaper(p));refs.append(b);});
    if(refs.childNodes.length)card.append(refs);$("themes").append(card);
  });
}
const questions = new Map(list(overview.attendance_questions).map(q=>[string(q.paper_id),list(q.questions)]));
function makeCard(p) {
  const a = p.assessment || {}, state=stateOf(p);
  const card=element("article","paper-card"); card.id="paper-"+encodeURIComponent(string(p.id));
  const top=element("div","paper-top"), index=element("div","card-index");
  index.append(element("span","paper-id",idOf(p)));
  const copy=element("button","copy-id","复制 ID");copy.type="button";copy.setAttribute("aria-label","复制论文 "+idOf(p)+" 的固定 ID");copy.addEventListener("click",()=>copyId(p));index.append(copy);top.append(index);
  const read=element("select","read-select");read.setAttribute("aria-label",idOf(p)+" 的阅读标记");
  [["unread","未读"],["to_read","待读"],["read","已读"],["starred","重点关注"]].forEach(([value,label])=>{const opt=element("option","",label);opt.value=value;read.append(opt);});
  const stored=readingMarks[p.id] || p.reading_status;read.value=["unread","to_read","read","starred"].includes(stored)?stored:"unread";read.addEventListener("change",()=>saveMark(p,read.value));top.append(read);card.append(top);
  const heading=element("h3"), titleLink=link(p.title,p.url);heading.append(titleLink || element("span","",p.title));card.append(heading);
  const badges=element("div","badges");
  if(state!=="include")appendBadge(badges,stateNames[state]||state,state==="pending"?"pending":"");
  appendBadge(badges,relationNames[a.relation],"accent");appendBadge(badges,priorityNames[a.priority],a.priority===1?"accent":"");
  labelsFor(p).forEach(label=>appendBadge(badges,label));
  if(badges.childNodes.length)card.append(badges);
  const reason=element("p","reason");reason.append(element("span","reason-label",state==="include"?"推荐理由":state==="exclude"?"排除理由":state==="pending"?"待核查说明":"处理状态"),element("span","",a.reason || "这篇论文尚未进行相关性评估。"));card.append(reason);
  const links=element("div","paper-links");addLink(links,"论文页面 ↗",p.url);addLink(links,"论文全文 ↗",p.pdf_url);if(links.childNodes.length)card.append(links);
  const details=element("details","details");details.append(element("summary","","展开研究内容、推荐依据与阅读建议"));
  const grid=element("div","detail-grid");
  section(grid,"作者",list(p.authors).length?p.authors.join(" · "):"作者信息未提供。",true);
  section(grid,"匹配的研究方向",list(a.topic_ids).map(topicName));
  const statusText = [acceptanceNames[p.acceptance] || "录用状态未知",relevanceNames[a.relevance],evidenceNames[a.evidence_status]].filter(Boolean).join(" · ");section(grid,"判断状态",statusText);
  section(grid,"重点阅读",a.reading_focus || (state==="unprocessed"?"需要先阅读资料并评估相关性。":""));
  section(grid,"个人备注",p.user_notes,true);
